<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6f42"><title>Suivi Livraisons</title>
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#1d2733;--m:#66727f;--p:#1d6f42;--b:#cfd6dd;--h:#e3efe7;--ok:#d3efdd;--wa:#fbe7bf;--ko:#f9d2d0;--x:#fff0a8}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--c:#1a222b;--t:#e8edf2;--m:#93a0ad;--p:#2e8b57;--b:#34414e;--h:#22382c;--ok:#1f4a32;--wa:#58431a;--ko:#592624;--x:#5a5320}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(54px + env(safe-area-inset-bottom))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:12px}
input,select,textarea,button{font:inherit;color:inherit}
.card input,.card select,.card button{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--b);border-radius:8px;background:var(--c)}
button{cursor:pointer}.card button,#top button,#more{background:var(--p);color:#fff;border:0;font-weight:600}
#top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--p);color:#fff}
#top button{width:auto;margin:0;padding:6px 12px;border-radius:8px;background:#fff3;border:1px solid #fff8}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#e0524d}.dot.on{background:#7dffb0}
#hd{padding:10px 12px}#hd .m{margin:4px 0}.m{color:var(--m);font-size:13px}
#hd input{border:1px solid var(--b);border-radius:6px;padding:6px;background:var(--c);width:200px;max-width:60%}
.gw{overflow:auto;max-height:calc(100dvh - 240px);border-top:1px solid var(--b)}
table{border-collapse:collapse;table-layout:fixed;min-width:1180px;width:100%;background:var(--c)}
th,td{border:1px solid var(--b);padding:0;height:34px}
th{position:sticky;top:0;background:var(--h);z-index:2;padding:6px;font-size:12px;text-align:left}
td:first-child,th:first-child{position:sticky;left:0;width:40px;background:var(--h);text-align:center;z-index:1;font-size:12px;color:var(--m)}
th:first-child{z-index:3}
td input,td select{width:100%;height:34px;border:0;padding:0 6px;background:transparent;outline:0;border-radius:0}
td input:focus,td select:focus{outline:2px solid var(--p);outline-offset:-2px}
td.x{background:var(--x)}select.ok{background:var(--ok)}select.wa{background:var(--wa)}select.ko{background:var(--ko)}
tr.ex td{color:var(--m);font-style:italic;padding:0 6px;background:var(--bg)}
#an td,#an th,#at td,#at th,#ht td,#ht th{padding:6px 8px;white-space:nowrap;height:auto;position:static}
#at,#an,#ht{min-width:0}tr.tot td{font-weight:700}
#more{margin:10px 12px;padding:10px;border-radius:8px;width:calc(100% - 24px)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:none;border:0;border-right:1px solid var(--b);background:transparent;padding:14px 16px;min-width:48px}
#tabs button.on{background:var(--h);font-weight:700;box-shadow:inset 0 -3px var(--p)}
.row{display:flex;gap:8px}.row>*{flex:1}.w{overflow-x:auto}
.hide{display:none!important}
#toast{position:fixed;left:12px;right:12px;bottom:70px;background:#222;color:#fff;padding:10px;border-radius:8px;text-align:center;z-index:9}
</style></head><body>
<section id="login" class="card"><h2>Suivi des livraisons</h2><p class="m">Cobra · Kinkoli</p>
<select id="lm"></select><input id="lc" type="password" inputmode="numeric" placeholder="Code d’accès"><button id="lg">Entrer</button><p id="le" class="m"></p></section>

<section id="app" class="hide">
<div id="top"><div><b>Suivi des livraisons</b> · <span id="who"></span><br><i class="dot" id="dot"></i> <small id="cn">hors ligne</small></div><button id="out">Quitter</button></div>

<div id="v-sheet" class="hide"><div id="hd"></div><div class="gw"><table id="g"></table></div><button id="more">+ 50 lignes</button></div>

<div id="v-an" class="hide"><div class="card"><label class="m">Date analysée</label><input type="date" id="ad"><div class="w"><table id="at"></table></div></div>
<div class="card"><b>Non livrés du jour</b><div class="w"><table id="an"></table></div></div></div>

<div id="v-hi" class="hide"><div class="card"><div class="row"><input type="date" id="hd2"><select id="hm"></select></div>
<div class="row"><select id="hs"></select><input id="hq" placeholder="Rechercher…"></div>
<p class="m" id="hc"></p><div class="w"><table id="ht"></table></div></div></div>

<nav id="tabs"></nav></section><div id="toast" class="hide"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import{getDatabase,ref,onValue,set,remove}from"https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
const db=getDatabase(initializeApp({
 apiKey:"AIzaSyDEewCZo1FJxzbOPjdIWChjkJLV3xfbLKU",
 authDomain:"suivi-livraison-4b30a.firebaseapp.com",
 databaseURL:"https://suivi-livraison-4b30a-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"suivi-livraison-4b30a",
 storageBucket:"suivi-livraison-4b30a.firebasestorage.app",
 messagingSenderId:"704187089933",
 appId:"1:704187089933:web:8c3cffeb15223c60610144"}));

const CODES={1:"6894",2:"2010",3:"2338",4:"5294",5:"1502",6:"5489",7:"8427",8:"4640",9:"9560",A:"151033"};
const ST=["Livré","Livraison partielle","Non livré"],SC={"Livré":"ok","Livraison partielle":"wa","Non livré":"ko"};
const K=["a","b","c","d","e","f","g","h"],TY=["date","text","select","text","text","date","time","text"];
const HD=["Date du rapport","Client / Magasin","Statut","N° Bon","N° Camion","Date de sortie","Heure de sortie","Motif (si non livré ou partielle)"];
const M=[1,2,3,4,5,6,7,8,9];
const $=s=>document.querySelector(s);
const iso=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const site=m=>m<=6?"Cobra":"Kinkoli";
const fr=d=>d?d.split("-").reverse().join("/"):"";
let data={},names={},user=null,view="",shown=60;
const nm=m=>names[m]||"Magasin "+m;
const cv=(m,r,k)=>data[m]?.[r]?.[k]??"";
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.remove("hide");setTimeout(()=>e.classList.add("hide"),2500)};
const opts=a=>a.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join("");
const last=m=>{let n=0;Object.entries(data[m]||{}).forEach(([r,x])=>{if(x&&Object.keys(x).length)n=Math.max(n,+r+1)});return n};

onValue(ref(db,"feuilles"),s=>{data=s.val()||{};render()});
onValue(ref(db,"noms"),s=>{names=s.val()||{};render()});
onValue(ref(db,".info/connected"),s=>{const o=!!s.val();$("#dot").classList.toggle("on",o);$("#cn").textContent=o?"synchronisé en direct":"hors ligne"});

/* Connexion */
function fillLogin(){const v=$("#lm").value;$("#lm").innerHTML=opts(M.map(i=>[i,nm(i)+" ("+site(i)+")"]))+'<option value="A">Administrateur</option>';if(v)$("#lm").value=v}
$("#lg").onclick=()=>{const k=$("#lm").value,c=$("#lc").value.trim();if(CODES[k]!==c){$("#le").textContent="Code incorrect.";return}
 try{localStorage.setItem("sl",JSON.stringify({k,c}))}catch{}enter(k)};
$("#out").onclick=()=>{try{localStorage.removeItem("sl")}catch{}user=null;$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#lc").value=""};
function enter(k){user=k;$("#login").classList.add("hide");$("#app").classList.remove("hide");
 show(k==="A"?"1":k)}
function tabs(){const T=user==="A"?[...M.map(i=>[String(i),names[i]||String(i)]),["H","Historique"],["A","Analyse"]]:[[user,names[user]||user]];
 $("#tabs").innerHTML=T.map(t=>`<button data-v="${t[0]}" class="${t[0]===view?"on":""}">${esc(t[1])}</button>`).join("")}
$("#tabs").onclick=e=>{if(e.target.dataset.v)show(e.target.dataset.v)};
function show(v){view=v;const sh=/^[1-9]$/.test(v);
 $("#v-sheet").classList.toggle("hide",!sh);$("#v-an").classList.toggle("hide",v!=="A");$("#v-hi").classList.toggle("hide",v!=="H");
 $("#who").textContent=user==="A"?"Administrateur":nm(user)+" · "+site(+user);
 if(sh)buildSheet();render()}

/* Feuille type Excel */
function buildSheet(n){const m=+view;shown=n||Math.min(500,Math.max(60,last(m)+20));
 $("#hd").innerHTML=`<b>Rapport de livraison — Site : ${site(m)}</b><div class="m">Une ligne par client/magasin. Livré ou Livraison partielle : remplir N° bon, N° camion, date et heure de sortie. Non livré ou partielle : remplir le motif.</div>Responsable : <input id="rp" placeholder="Nom du magasin">`;
 let h=`<thead><tr><th>#</th>${HD.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody><tr class="ex"><td>ex.</td><td>18/10/2026</td><td>Client exemple</td><td>Livré</td><td>BL-1234</td><td>8541 TU 123</td><td>18/10/2026</td><td>08:30</td><td></td></tr>`;
 for(let r=0;r<shown;r++)h+=`<tr><td>${r+1}</td>${K.map((k,i)=>`<td>${TY[i]==="select"?`<select data-r="${r}" data-k="${k}"><option></option>${ST.map(s=>`<option>${s}</option>`).join("")}</select>`:`<input type="${TY[i]}" data-r="${r}" data-k="${k}">`}</td>`).join("")}</tr>`;
 $("#g").innerHTML=h+"</tbody>";$("#more").classList.toggle("hide",shown>=500);paint()}
$("#more").onclick=()=>buildSheet(Math.min(500,shown+50));
function paint(){const m=+view,a=document.activeElement;if(last(m)>shown)return buildSheet();
 const rp=$("#rp");if(rp&&a!==rp)rp.value=names[m]||"";
 document.querySelectorAll("#g [data-r]").forEach(el=>{const{r,k}=el.dataset,v=cv(m,r,k),s=cv(m,r,"c");
  if(el!==a&&el.value!==v)el.value=v;if(k==="c")el.className=SC[v]||"";
  const need=s&&((s!==ST[2]&&"defg".includes(k))||(s!==ST[0]&&k==="h"));
  el.parentNode.classList.toggle("x",!!need&&!v)})}
$("#g").onchange=e=>{const{r,k}=e.target.dataset;if(r==null)return;const m=+view,v=e.target.value.trim();
 set(ref(db,`feuilles/${m}/${r}/${k}`),v||null).catch(x=>toast(x.message));
 if(k==="b"&&v&&!cv(m,r,"a"))set(ref(db,`feuilles/${m}/${r}/a`),iso())};
$("#hd").onchange=e=>{if(e.target.id!=="rp")return;const m=+view,v=e.target.value.trim();(v?set(ref(db,"noms/"+m),v):remove(ref(db,"noms/"+m))).catch(x=>toast(x.message))};

/* Analyse + Historique */
function flat(){const o=[];M.forEach(m=>Object.entries(data[m]||{}).forEach(([r,x])=>{if(x&&x.b)o.push({m,r:+r,...x})}));return o}
function cnt(l){const o={t:l.length,l:0,p:0,n:0};l.forEach(r=>r.c===ST[0]?o.l++:r.c===ST[1]?o.p++:r.c===ST[2]&&o.n++);o.pc=(o.t?Math.round(o.l/o.t*100):0)+" %";return o}
const tr=(a,c)=>`<tr${c?` class="${c}"`:""}>${a.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`;
$("#ad").value=iso();
$("#hm").innerHTML='<option value="">Tous les magasins</option>'+opts(M.map(i=>[i,"Magasin "+i]));
$("#hs").innerHTML='<option value="">Tous les statuts</option>'+opts(ST.map(x=>[x,x]));
function render(){fillLogin();if(!user)return;tabs();
 if(/^[1-9]$/.test(view))paint();
 if(view==="A"){const l=flat().filter(r=>r.a===$("#ad").value),by=f=>cnt(l.filter(f)),R=(a,o,c)=>tr([...a,o.t,o.l,o.p,o.n,o.pc],c);
  $("#at").innerHTML="<tr><th>Site</th><th>Magasin</th><th>Total</th><th>Livrés</th><th>Partielles</th><th>Non livrés</th><th>% livrés</th></tr>"+
   M.map(i=>R([site(i),nm(i)],by(r=>r.m==i))).join("")+R(["Total Cobra",""],by(r=>r.m<=6),"tot")+R(["Total Kinkoli",""],by(r=>r.m>6),"tot")+R(["TOTAL GÉNÉRAL",""],by(()=>true),"tot");
  $("#an").innerHTML="<tr><th>Magasin</th><th>Client / Magasin</th><th>Motif</th></tr>"+l.filter(r=>r.c===ST[2]).sort((a,b)=>a.m-b.m).map(r=>tr([nm(r.m),r.b,r.h])).join("")}
 if(view==="H"){const q=$("#hq").value.toLowerCase(),d=$("#hd2").value,m=$("#hm").value,s=$("#hs").value;
  const l=flat().filter(r=>(!d||r.a===d)&&(!m||r.m==m)&&(!s||r.c===s)&&(!q||JSON.stringify(r).toLowerCase().includes(q))).sort((x,y)=>(y.a||"").localeCompare(x.a||"")||x.m-y.m||x.r-y.r);
  $("#hc").textContent=l.length+" ligne(s)"+(l.length>500?" — 500 premières affichées":"");
  $("#ht").innerHTML="<tr><th>Magasin</th><th>Site</th><th>Date</th><th>Client</th><th>Statut</th><th>Bon</th><th>Camion</th><th>Sortie</th><th>Motif</th></tr>"+
   l.slice(0,500).map(r=>tr([nm(r.m),site(r.m),fr(r.a),r.b,r.c,r.d,r.e,(fr(r.f)+" "+(r.g||"")).trim(),r.h])).join("")}}
["ad","hd2","hm","hs"].forEach(i=>$("#"+i).onchange=render);$("#hq").oninput=render;

fillLogin();
try{const s=JSON.parse(localStorage.getItem("sl")||"null");if(s&&CODES[s.k]===s.c)enter(s.k)}catch{}
</script></body></html>
